name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  changes:
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_ci: ${{ steps.classify.outputs.full_ci }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify documentation-only changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          full_ci=true
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]] &&
             [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ ! "$BASE_SHA" =~ ^0+$ ]] &&
             git cat-file -e "$BASE_SHA^{commit}" && git cat-file -e "$HEAD_SHA^{commit}"; then
            full_ci=false
            while IFS= read -r -d '' path; do
              case "$path" in
                .env.example|CHANGELOG.md|README.md|README.en.md|docs/*) ;;
                *) full_ci=true; break ;;
              esac
            done < <(git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "full_ci=$full_ci" | tee -a "$GITHUB_OUTPUT"

  docs:
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Repository whitespace check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD --

      - name: Markdown fence structure
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            count="$(awk '/^```/ { count++ } END { print count + 0 }' "$file")"
            if (( count % 2 != 0 )); then
              echo "::error file=$file::unbalanced fenced code blocks"
              exit 1
            fi
          done < <(git ls-files -z '*.md')

      - name: Documentation and version binding tests
        run: go test ./internal/releasepkg ./internal/config -count=1

  quality:
    if: ${{ github.event_name != 'release' && needs.changes.outputs.full_ci == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(find cmd internal -type f -name '*.go' -print0 | sort -z | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt is required for:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Repository whitespace check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD --

      - name: go vet
        run: go vet ./...

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Race tests and coverage
        run: |
          set -euo pipefail
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%$/, "", $3); print $3}')"
          [[ -n "$total" ]] || { echo "::error::could not read total Go coverage"; exit 1; }
          awk -v total="$total" 'BEGIN {
            if (total + 0 < 75.0) {
              printf "::error::total Go coverage %.1f%% is below 75.0%%\n", total
              exit 1
            }
            printf "total Go coverage %.1f%%\n", total
          }'

      - name: Go archive and signature failure gates
        run: |
          go test -race ./internal/dist \
            -run '^(TestCheckArchive|TestArchiveEntryLimit|TestExtractRejectsSpecialAndTraversal|TestVerifyReleaseFailClosed)$'

      - name: Production entrypoint lock contract
        run: build/runtime-lock-test.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  bootstrap:
    if: ${{ github.event_name != 'release' && needs.changes.outputs.full_ci == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Syntax-check the retained Shell gates
        run: |
          bash -n \
            sun.sh \
            build/archive-safety-test.sh \
            build/bootstrap-test.sh \
            build/build.sh \
            build/compat-test.sh \
            build/dnf5-versionlock-test.sh \
            build/interactive-test.sh \
            build/live-canary.sh \
            build/reproducibility-check.sh \
            build/rocky-bootstrap-test.sh \
            build/rpm-best-effort-test.sh \
            build/rollback-test.sh \
            build/runtime-lock-test.sh

      - name: ShellCheck the retained Shell gates
        run: |
          shellcheck -s bash -S info \
            sun.sh \
            build/archive-safety-test.sh \
            build/bootstrap-test.sh \
            build/build.sh \
            build/compat-test.sh \
            build/dnf5-versionlock-test.sh \
            build/interactive-test.sh \
            build/live-canary.sh \
            build/reproducibility-check.sh \
            build/rocky-bootstrap-test.sh \
            build/rpm-best-effort-test.sh \
            build/rollback-test.sh \
            build/runtime-lock-test.sh

      - name: Compile Python test helpers
        run: |
          python3 -I -m py_compile \
            build/fake-notify-api.py \
            build/pty-driver.py \
            build/pty-driver-test.py \
            build/release-archive-test.py

      - name: Test PTY process-group cleanup
        run: python3 -I build/pty-driver-test.py

      - name: Hostile bootstrap archive gate
        run: build/archive-safety-test.sh

      - name: Bootstrap argument and dependency gate
        run: sudo build/bootstrap-test.sh

      - name: Live canary host guard
        run: |
          set -euo pipefail
          if RUNNER_ENVIRONMENT=self-hosted build/live-canary.sh 2>canary-guard.err; then
            echo "::error::live canary accepted a non-hosted target"
            exit 1
          fi
          grep -Fq 'refusing to run outside a GitHub-hosted runner' canary-guard.err

      - name: Stable mirror publication invariants
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/mirror-release.yml').read_text(encoding='utf-8')
          workflow_sha_ref = 'ref: $' + '{{ github.workflow_sha }}'
          release_sha_ref = 'ref: $' + '{{ github.event.workflow_run.head_sha || inputs.tag }}'
          upstream_sha_env = 'EXPECTED_HEAD_SHA: $' + '{{ github.event.workflow_run.head_sha }}'
          stable_concurrency = 'group: signed-release-mirror-stable'
          concurrency_groups = [
              line.strip()
              for line in workflow.splitlines()
              if line.startswith('      group:')
          ]
          if concurrency_groups != [stable_concurrency]:
              raise SystemExit(
                  'mirror workflow must globally serialize stable publication: '
                  f'{concurrency_groups}'
              )
          required = [
              "workflows: ['CI']",
              'environment: release-mirror',
              '- name: Validate release identity',
              '- name: Require immutable release state',
              workflow_sha_ref,
              release_sha_ref,
              'path: released-source',
              '- name: Bind release tag to the verified commit',
              upstream_sha_env,
              'release tag $TAG must be annotated and peel to checked commit $released_sha',
              'manual mirror dispatches must run from refs/heads/main',
              'workflow revision $TRUSTED_WORKFLOW_SHA is not contained in protected main',
              'repos/$GITHUB_REPOSITORY/compare/$released_sha...$default_sha',
              'release commit $released_sha is not contained in protected main',
              '- name: Install runtime verification tools',
              '- name: Prepare bounded HTTPS downloader',
              '- name: Verify every packaged runtime',
              '/usr/bin/qemu-aarch64-static',
              'readelf -W -l "$runtime"',
              'env -i LC_ALL=C PATH=/usr/bin:/bin',
              'raise ValueError("runtime output exceeds byte limit")',
              '"$(wc -c < "$output")" -eq "$((${#expected} + 1))"',
              '"rel/$tarball" "$version" "$epoch" released-source',
              '/usr/bin/timeout --signal=TERM --kill-after=5s 180s',
              'raise ValueError("download exceeds byte limit")',
              'gpg --no-options --batch --status-fd=1',
              'cmp "deploy/$TAG/$asset" "public-check/$asset"',
              '- name: Confirm GitHub Latest before stable update',
              '- name: Publish stable bootstrap through forced-command rrsync',
              '- name: Publish latest manifest last through forced-command rrsync',
              '"deploy/$TAG/sun.sh" "$MIRROR_USER@$MIRROR_HOST:sun.sh"',
              'latest.json "$MIRROR_USER@$MIRROR_HOST:latest.json"',
              'needs: verify-and-sync',
              'uses: ./.github/workflows/live-canary.yml',
          ]
          for item in required:
              if item not in workflow:
                  raise SystemExit(f'mirror workflow invariant missing: {item}')
          ordered = [
              '- name: Validate release identity',
              '- name: Require immutable release state',
              '- name: Checkout the trusted workflow revision',
              '- name: Checkout the released tag as untrusted data',
              '- name: Bind release tag to the verified commit',
              '- name: Install runtime verification tools',
              '- name: Prepare bounded HTTPS downloader',
              '- name: Download release assets',
              '- name: Verify checksum and pinned GPG signature',
              '- name: Verify every packaged runtime',
              '- name: Prepare immutable release directory and latest files',
              '- name: Configure pinned SSH identity',
              '- name: Upload immutable signed release files',
              '- name: Verify release files through the public mirror',
              '- name: Confirm GitHub Latest before stable update',
              '- name: Publish stable bootstrap through forced-command rrsync',
              '- name: Publish latest manifest last through forced-command rrsync',
          ]
          positions = [workflow.index(item) for item in ordered]
          if positions != sorted(positions):
              raise SystemExit('stable mirror publication order changed')
          if '\n  release:\n' in workflow or 'python3 released-source/' in workflow:
              raise SystemExit('mirror workflow must not run directly from a release tag')
          if 'GH_TOKEN:' in workflow.split('    steps:', 1)[0]:
              raise SystemExit('mirror job must not expose GITHUB_TOKEN to every verification step')
          if '${peeled_sha:-$direct_sha}' in workflow or 'tag_sha=' in workflow:
              raise SystemExit('mirror workflow must reject lightweight release tags')
          if 'gpg --batch' in workflow:
              raise SystemExit('mirror verification must ignore runner GPG option files')
          if 'gh release download' in workflow or workflow.count('/usr/bin/curl') != 1:
              raise SystemExit('every release download must use the bounded HTTPS helper')
          if (workflow.count('raise ValueError("download exceeds byte limit")') != 1 or
                  workflow.count('"$RUNNER_TEMP/download-limited"') != 6):
              raise SystemExit('the bounded HTTPS helper and all four call sites must remain intact')

          stable = workflow.split(
              '- name: Confirm GitHub Latest before stable update', 1
          )[1].split('- name: Remove SSH identity', 1)[0]
          stable_order = [
              'latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"',
              '- name: Publish stable bootstrap through forced-command rrsync',
              '"deploy/$TAG/sun.sh" "$MIRROR_USER@$MIRROR_HOST:sun.sh"',
              '"$MIRROR_BASE_URL/sun.sh?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT"',
              'cmp "deploy/$TAG/sun.sh" public-sun.sh',
              '- name: Publish latest manifest last through forced-command rrsync',
              'latest.json "$MIRROR_USER@$MIRROR_HOST:latest.json"',
              '"$MIRROR_BASE_URL/latest.json?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT"',
              'cmp latest.json public-latest.json',
          ]
          stable_positions = [stable.index(item) for item in stable_order]
          if stable_positions != sorted(stable_positions):
              raise SystemExit('stable files must use ordered rrsync writes and public read-back')
          if stable.count('rsync --archive --checksum --delay-updates --chmod=F644') != 2:
              raise SystemExit('stable publication must contain exactly two delayed rrsync writes')
          forbidden_remote_execution = [
              'mirror-lock.sh', 'REMOTE_SCRIPT', 'coproc ', 'flock ',
              'ssh_command=', 'bash --noprofile', 'PUBLISH_SUN', 'PUBLISH_LATEST',
          ]
          for item in forbidden_remote_execution:
              if item in stable:
                  raise SystemExit(
                      f'forced-command rrsync publication must not execute remote commands: {item}'
                  )
          if 'RSYNC_RSH=ssh ' not in workflow:
              raise SystemExit('pinned SSH transport must remain confined to RSYNC_RSH')

          canary = Path('.github/workflows/live-canary.yml').read_text(encoding='utf-8')
          if 'workflow_call:' not in canary or 'workflow_run:' in canary or '\nconcurrency:' in canary:
              raise SystemExit('release canary must be directly callable without dropping pending runs')
          PY

      - name: Release event verifier invariants
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          release = workflow.split('\n  verify-signed-release:\n', 1)[1]
          required = [
              '- name: Prepare bounded release I/O helper',
              'raise ValueError("input exceeds byte limit")',
              '/usr/bin/curl --disable --fail --location --silent --show-error',
              '--max-filesize "$limit"',
              '/usr/bin/python3 -I "$RUNNER_TEMP/write-limited.py" "$limit" "$part"',
              '/usr/bin/env -i LC_ALL=C PATH=/usr/bin:/bin',
              '/usr/bin/timeout --signal=TERM --kill-after=5s 15s "$runtime" --version',
              '/usr/bin/python3 -I "$RUNNER_TEMP/write-limited.py" 4096 "$runtime_version_part"',
              'gpg --no-options --batch --status-fd=1 --verify',
          ]
          for item in required:
              if item not in release:
                  raise SystemExit(f'release verifier invariant missing: {item}')
          if 'gh release download' in release:
              raise SystemExit('release verifier must not download assets without a byte limit')
          if 'environment:' in release.split('    steps:', 1)[0]:
              raise SystemExit('unprivileged release verifier must not receive an Environment')
          PY

  package:
    if: ${{ github.event_name != 'release' && needs.changes.outputs.full_ci == 'true' }}
    needs: [changes, quality, bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Reject ignored untracked release sources
        run: |
          set -euo pipefail
          probe=internal/releasepkg/ci-untracked-probe.go
          exclude_backup="$(mktemp)"
          cp .git/info/exclude "$exclude_backup"
          cleanup() {
            rm -f "$probe"
            cp "$exclude_backup" .git/info/exclude
            rm -f "$exclude_backup"
          }
          trap cleanup EXIT
          printf '/%s\n' "$probe" >>.git/info/exclude
          printf 'package releasepkg\n' >"$probe"
          if go run ./cmd/sun-release package --dist dist-probe --sign off \
              >/tmp/package-probe.out 2>/tmp/package-probe.err; then
            echo "::error::Go packager accepted an ignored untracked release source"
            exit 1
          fi
          grep -Fq "$probe" /tmp/package-probe.err

      - name: Build the complete release twice
        run: |
          set -euo pipefail
          rm -rf dist dist-a dist-b
          epoch="$(git show -s --format=%ct HEAD)"
          go run ./cmd/sun-release package --dist dist-a --sign off --source-date-epoch "$epoch"
          go run ./cmd/sun-release package --dist dist-b --sign off --source-date-epoch "$epoch"

      - name: Verify reproducibility, checksum, and exact allowlist
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' VERSION)"
          [[ -n "$version" && "$(wc -l <VERSION)" -eq 1 ]] || {
            echo "::error::invalid canonical VERSION"
            exit 1
          }
          archive="security-update-notify-${version}.tar.gz"
          for dir in dist-a dist-b; do
            [[ "$(find "$dir" -maxdepth 1 -type f | wc -l)" -eq 2 ]] || {
              echo "::error::$dir must contain exactly the unsigned tarball and checksum"
              exit 1
            }
            (cd "$dir" && sha256sum -c "$archive.sha256")
          done
          cmp "dist-a/$archive" "dist-b/$archive"
          cmp "dist-a/$archive.sha256" "dist-b/$archive.sha256"
          epoch="$(git show -s --format=%ct HEAD)"
          python3 -I build/release-archive-test.py "dist-a/$archive" "$version" "$epoch" .
          mkdir dist
          cp "dist-a/$archive" "dist-a/$archive.sha256" dist/

      - name: Upload unsigned CI release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-update-notify-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  rpm-lifecycle:
    if: ${{ github.event_name != 'release' && needs.changes.outputs.full_ci == 'true' }}
    needs: [changes, package]
    name: RPM lifecycle (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image:
          - 'rockylinux/rockylinux:8-minimal'
          - 'rockylinux/rockylinux:9-minimal'
          - 'rockylinux/rockylinux:10-minimal'
          - 'almalinux:8-minimal'
          - 'almalinux:9-minimal'
          - 'almalinux:10-minimal'
          - 'fedora:43'
          - 'fedora:44'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CI release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-update-notify-dist
          path: dist

      - name: Select the packaged amd64 installer
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' VERSION)"
          [[ -n "$version" && "$(wc -l <VERSION)" -eq 1 ]]
          package_root="$RUNNER_TEMP/security-update-notify-rpm-package"
          mkdir -p "$package_root"
          tar -xzf "dist/security-update-notify-$version.tar.gz" -C "$package_root"
          runtime="$package_root/security-update-notify-$version/files/security-update-notify-linux-amd64"
          [[ -x "$runtime" ]]
          printf 'SUN_INSTALL_BINARY=%s\n' "$runtime" >>"$GITHUB_ENV"

      - name: Bootstrap, install, rollback, upgrade, and purge
        run: |
          docker run --rm \
            -e SUN_CONTAINER_TEST=1 \
            -e SUN_INSTALL_BINARY=/sun-bin \
            -v "$PWD:/src:ro" \
            -v "$SUN_INSTALL_BINARY:/sun-bin:ro" \
            "${{ matrix.image }}" bash /src/build/rocky-bootstrap-test.sh

  best-effort-apt-lifecycle:
    if: ${{ github.event_name != 'release' && needs.changes.outputs.full_ci == 'true' }}
    needs: [changes, package]
    name: Best-effort APT lifecycle (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'debian:11'
          - 'ubuntu:20.04'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CI release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-update-notify-dist
          path: dist

      - name: Upgrade a schema-3 installation
        run: |
          docker run --rm \
            -e SUN_CONTAINER_TEST=1 \
            -e SUN_ALLOW_BEST_EFFORT=1 \
            -v "$PWD:/src:ro" \
            "${{ matrix.image }}" bash /src/build/compat-test.sh

      - name: Fresh install, failed-upgrade rollback, and uninstall lifecycle
        run: |
          docker run --rm \
            -e SUN_CONTAINER_TEST=1 \
            -e SUN_ALLOW_BEST_EFFORT=1 \
            -v "$PWD:/src:ro" \
            "${{ matrix.image }}" bash /src/build/rollback-test.sh

  best-effort-rpm-lifecycle:
    if: ${{ github.event_name != 'release' && needs.changes.outputs.full_ci == 'true' }}
    needs: [changes, package]
    name: Best-effort RPM lifecycle (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image:
          - 'quay.io/centos/centos:stream9'
          - 'quay.io/centos/centos:stream10'
          - 'oraclelinux:8-slim'
          - 'oraclelinux:9-slim'
          - 'oraclelinux:10-slim'
          - 'amazonlinux:2023'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CI release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-update-notify-dist
          path: dist

      - name: Select the packaged amd64 installer
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' VERSION)"
          [[ -n "$version" && "$(wc -l <VERSION)" -eq 1 ]]
          package_root="$RUNNER_TEMP/security-update-notify-best-effort-rpm-package"
          mkdir -p "$package_root"
          tar -xzf "dist/security-update-notify-$version.tar.gz" -C "$package_root"
          runtime="$package_root/security-update-notify-$version/files/security-update-notify-linux-amd64"
          [[ -x "$runtime" ]]
          printf 'SUN_INSTALL_BINARY=%s\n' "$runtime" >>"$GITHUB_ENV"

      - name: Install, upgrade, and purge with real RPM dependencies
        run: |
          docker run --rm \
            -e SUN_CONTAINER_TEST=1 \
            -e SUN_INSTALL_BINARY=/sun-bin \
            -v "$PWD:/src:ro" \
            -v "$SUN_INSTALL_BINARY:/sun-bin:ro" \
            "${{ matrix.image }}" bash /src/build/rpm-best-effort-test.sh

  lifecycle:
    if: ${{ github.event_name != 'release' && needs.changes.outputs.full_ci == 'true' }}
    needs: [changes, package]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CI release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-update-notify-dist
          path: dist

      - name: Upgrade a schema-3 installation
        run: docker run --rm -e SUN_CONTAINER_TEST=1 -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/build/compat-test.sh

      - name: Fresh install, failed-upgrade rollback, and uninstall lifecycle
        run: docker run --rm -e SUN_CONTAINER_TEST=1 -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/build/rollback-test.sh

      - name: Human-style PTY install and notification lifecycle
        run: docker run --rm -e SUN_CONTAINER_TEST=1 -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/build/interactive-test.sh

  multiarch:
    if: ${{ github.event_name != 'release' && needs.changes.outputs.full_ci == 'true' }}
    needs: [changes, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Download CI release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-update-notify-dist
          path: dist

      - name: Install QEMU user emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Run restore filesystem syscalls on all five architectures
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tests='^(TestPurgeRestorePreservesFileMetadataAndXattrs|TestPurgeRestoresFixedAPTBackupWhenDestinationIsMissing|TestPurgeAPTDoesNotDeleteFixedBackupReplacedDuringCleanup|TestPurgeDNFDoesNotDeleteConfigRecreatedAfterValidatedTargetDisappears|TestRestoreFileRetainsConcurrentDestinationChangedAfterExchange)$'
          for arch in amd64 arm64 386 ppc64le s390x; do
            binary="$work/uninstaller-$arch.test"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go test -c -o "$binary" ./internal/uninstaller
            case "$arch" in
              amd64|386) command=("$binary") ;;
              arm64) command=(qemu-aarch64-static "$binary") ;;
              ppc64le) command=(qemu-ppc64le-static "$binary") ;;
              s390x) command=(qemu-s390x-static "$binary") ;;
              *) echo "unknown architecture: $arch" >&2; exit 2 ;;
            esac
            "${command[@]}" -test.run "$tests" -test.count=1
          done

      - name: Run all five packaged architectures
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' VERSION)"
          archive="dist/security-update-notify-${version}.tar.gz"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar -xzf "$archive" -C "$work"
          package_dir="$work/security-update-notify-$version"
          config="$work/runtime.env"
          cat >"$config" <<'EOF'
          CONFIG_VERSION=4
          NOTIFY_CHANNELS=telegram
          TELEGRAM_BOT_TOKEN=123456:fake_TOKEN-value
          TELEGRAM_CHAT_ID=-100999
          HOST_LABEL=golden-host
          BACKEND=apt
          NOTIFY_LANG=zh
          INCLUDE_PUBLIC_IP=0
          CHECK_UPDATE_HEALTH=0
          CHECK_EOL=0
          STALE_UPDATE_DAYS=0
          CHECK_SELF_UPDATE=0
          EOF
          chmod 0600 "$config"
          want="$(python3 -I -c "import json; print({x['name']: x['hash'] for x in json.load(open('internal/golden/testdata/scenarios.json'))}['apt-test-reboot-zh'])")"
          run_arch() {
            local arch="$1"
            local binary="$package_dir/files/security-update-notify-linux-$arch"
            local -a command
            case "$arch" in
              amd64) command=("$binary") ;;
              arm64) command=(qemu-aarch64-static "$binary") ;;
              386) command=("$binary") ;;
              ppc64le) command=(qemu-ppc64le-static "$binary") ;;
              s390x) command=(qemu-s390x-static "$binary") ;;
              *) echo "unknown architecture: $arch" >&2; return 2 ;;
            esac
            [[ "$("${command[@]}" --version)" == "security-update-notify $version" ]]
            local got
            got="$(SECURITY_UPDATE_NOTIFY_ENV="$config" "${command[@]}" \
              --test-reboot --no-dedupe --dry-run | awk -F '\t' '$1 == "HASH" {print $2}')"
            [[ "$got" == "$want" ]] || {
              echo "::error::$arch runtime hash $got != golden $want"
              return 1
            }
            echo "OK linux/$arch $got"
          }
          for arch in amd64 arm64 386 ppc64le s390x; do
            run_arch "$arch"
          done

  ci-gate:
    name: ci-gate
    if: ${{ always() && github.event_name != 'release' }}
    needs:
      - changes
      - docs
      - quality
      - bootstrap
      - package
      - rpm-lifecycle
      - best-effort-apt-lifecycle
      - best-effort-rpm-lifecycle
      - lifecycle
      - multiarch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected CI tier
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = []
          for name in ("changes", "docs"):
              if needs[name]["result"] != "success":
                  failures.append(f"{name}={needs[name]['result']}")

          full_ci = needs["changes"].get("outputs", {}).get("full_ci") == "true"
          full_jobs = (
              "quality",
              "bootstrap",
              "package",
              "rpm-lifecycle",
              "best-effort-apt-lifecycle",
              "best-effort-rpm-lifecycle",
              "lifecycle",
              "multiarch",
          )
          expected = "success" if full_ci else "skipped"
          for name in full_jobs:
              if needs[name]["result"] != expected:
                  failures.append(f"{name}={needs[name]['result']} (expected {expected})")

          if failures:
              raise SystemExit("CI gate rejected: " + ", ".join(failures))
          print("full CI tier passed" if full_ci else "documentation CI tier passed")
          PY

  verify-signed-release:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require immutable release state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)"
          if [[ "$immutable" != "true" ]]; then
            case "$TAG" in
              v3.0.0|v3.0.1)
                echo "::notice::verifying a release published before immutability was enabled: $TAG"
                ;;
              *)
                echo "::error::release $TAG is not immutable"
                exit 1
                ;;
            esac
          fi

      - name: Checkout the release verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the released tag as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          path: released-source
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare bounded release I/O helper
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/write-limited.py" <<'PY'
          import os
          import sys

          if len(sys.argv) != 3:
              raise SystemExit(2)
          limit = int(sys.argv[1])
          path = sys.argv[2]
          if limit <= 0:
              raise SystemExit(2)
          try:
              with open(path, "xb") as output:
                  remaining = limit
                  while True:
                      chunk = sys.stdin.buffer.read(min(65536, remaining + 1))
                      if not chunk:
                          break
                      if len(chunk) > remaining:
                          raise ValueError("input exceeds byte limit")
                      output.write(chunk)
                      remaining -= len(chunk)
          except Exception as exc:
              try:
                  os.unlink(path)
              except FileNotFoundError:
                  pass
              print(f"bounded input failed: {exc}", file=sys.stderr)
              raise SystemExit(1)
          PY
          chmod 0600 "$RUNNER_TEMP/write-limited.py"

      - name: Download the exact release asset set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir rel
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._-][0-9A-Za-z]+)?$ && "${#TAG}" -le 65 ]] || {
            echo "::error::invalid release tag: $TAG"
            exit 1
          }
          version="${TAG#v}"
          archive="security-update-notify-${version}.tar.gz"
          declaration_count="$(grep -c '^BOOTSTRAP_SIGNATURE_ASSET=' released-source/sun.sh || true)"
          bootstrap_signature_asset="$(sed -n 's/^BOOTSTRAP_SIGNATURE_ASSET="\([A-Za-z0-9._-]*\)"$/\1/p' released-source/sun.sh)"
          notation_count="$(grep -c '^BOOTSTRAP_VERSION_NOTATION=' released-source/sun.sh || true)"
          bootstrap_version_notation="$(sed -n 's/^BOOTSTRAP_VERSION_NOTATION="\([A-Za-z0-9@._-]*\)"$/\1/p' released-source/sun.sh)"
          if [[ "$declaration_count" -eq 0 ]]; then
            [[ -z "$bootstrap_signature_asset" && "$notation_count" -eq 0 \
               && -z "$bootstrap_version_notation" ]]
            case "$TAG" in
              v3.0.0|v3.0.1) ;;
              *)
                echo "::error::$TAG does not declare the required first-install bootstrap signature"
                exit 1
                ;;
            esac
          elif [[ "$declaration_count" -eq 1 && "$bootstrap_signature_asset" == "sun.sh.asc" \
                  && "$notation_count" -eq 1 \
                  && "$bootstrap_version_notation" == "release-version@xxv.cc" ]]; then
            :
          else
            echo "::error::invalid bootstrap signature asset declaration"
            exit 1
          fi
          expected_assets=("$archive" "$archive.sha256" "$archive.asc")
          if [[ -n "$bootstrap_signature_asset" ]]; then
            expected_assets+=("$bootstrap_signature_asset")
          fi
          mapfile -t actual_assets < <(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              LC_ALL=C sort
          )
          mapfile -t expected_assets < <(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort)
          if ! diff -u <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${actual_assets[@]}"); then
            echo "::error::unexpected GitHub release asset set"
            exit 1
          fi
          download_limited() {
            local limit="$1" output="$2" url="$3" part="${2}.part"
            rm -f -- "$part"
            if /usr/bin/timeout --signal=TERM --kill-after=5s 180s \
                /usr/bin/curl --disable --fail --location --silent --show-error \
                  --connect-timeout 20 --max-time 120 --retry 3 --retry-delay 1 \
                  --retry-all-errors --retry-max-time 150 --max-filesize "$limit" \
                  --proto '=https' --proto-redir '=https' "$url" | \
                /usr/bin/python3 -I "$RUNNER_TEMP/write-limited.py" "$limit" "$part" && \
                mv -f -- "$part" "$output"; then
              return 0
            fi
            rm -f -- "$part"
            return 1
          }
          github_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for asset in "${expected_assets[@]}"; do
            limit=1048576
            [[ "$asset" != "$archive" ]] || limit=268435456
            download_limited "$limit" "rel/$asset" "$github_base/$asset"
          done
          printf 'BOOTSTRAP_SIGNATURE_ASSET=%s\nBOOTSTRAP_VERSION_NOTATION=%s\n' \
            "$bootstrap_signature_asset" "$bootstrap_version_notation" >> "$GITHUB_ENV"

      - name: Verify checksum, pinned signer, and release allowlist
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._-][0-9A-Za-z]+)?$ && "${#TAG}" -le 65 ]] || {
            echo "::error::invalid release tag: $TAG"
            exit 1
          }
          version="${TAG#v}"
          archive="security-update-notify-${version}.tar.gz"
          source_version="$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' released-source/VERSION)"
          [[ "$source_version" == "$version" && "$(wc -l <released-source/VERSION)" -eq 1 ]] || {
            echo "::error::released source VERSION is not bound to $TAG"
            exit 1
          }
          cmp files/release-signing.pub.asc released-source/files/release-signing.pub.asc || {
            echo "::error::released source verification key differs from the trusted workflow key"
            exit 1
          }
          [[ -f "rel/$archive" && -f "rel/$archive.sha256" && -f "rel/$archive.asc" \
             && ( -z "$BOOTSTRAP_SIGNATURE_ASSET" || -f "rel/$BOOTSTRAP_SIGNATURE_ASSET" ) ]] || {
            echo "::error::release must contain exactly the signed asset set for $archive"
            exit 1
          }
          expected_count=3
          [[ -z "$BOOTSTRAP_SIGNATURE_ASSET" ]] || expected_count=4
          [[ "$(find rel -maxdepth 1 -type f | wc -l)" -eq "$expected_count" ]] || {
            echo "::error::unexpected release asset set"
            exit 1
          }
          [[ "$(stat -c %s "rel/$archive")" -gt 0 && "$(stat -c %s "rel/$archive")" -le 268435456 ]]
          for metadata in "$archive.sha256" "$archive.asc"; do
            [[ "$(stat -c %s "rel/$metadata")" -gt 0 && "$(stat -c %s "rel/$metadata")" -le 1048576 ]]
          done
          if [[ -n "$BOOTSTRAP_SIGNATURE_ASSET" ]]; then
            [[ "$(stat -c %s "rel/$BOOTSTRAP_SIGNATURE_ASSET")" -gt 0 \
               && "$(stat -c %s "rel/$BOOTSTRAP_SIGNATURE_ASSET")" -le 1048576 ]] || {
              echo "::error::$BOOTSTRAP_SIGNATURE_ASSET has an invalid size"
              exit 1
            }
          fi

          [[ "$(wc -l <"rel/$archive.sha256")" -eq 1 ]]
          read -r expected_sha expected_name extra <"rel/$archive.sha256"
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ && "$expected_name" == "$archive" && -z "${extra:-}" ]] || {
            echo "::error::checksum manifest is not bound to $archive"
            exit 1
          }
          actual_sha="$(sha256sum "rel/$archive" | awk '{print $1}')"
          [[ "$actual_sha" == "$expected_sha" ]] || { echo "::error::checksum mismatch"; exit 1; }

          expected_pin='C678256ACBFC6491BF5076655F3AE24999921FFC'
          source_pin="$(sed -n 's/^RELEASE_SIGNING_FINGERPRINT="\([0-9A-Fa-f]\{40\}\)"$/\1/p' released-source/sun.sh)"
          [[ "$source_pin" == "$expected_pin" \
             && "$(grep -c '^RELEASE_SIGNING_FINGERPRINT=' released-source/sun.sh)" -eq 1 ]] || {
            echo "::error::invalid pinned release fingerprint"
            exit 1
          }
          pin="$expected_pin"
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 0700 "$GNUPGHOME"
          gpg --no-options --batch --import files/release-signing.pub.asc
          mapfile -t primary_fingerprints < <(
            gpg --no-options --batch --with-colons --list-keys |
              awk -F: '$1 == "pub" {want = 1; next} want && $1 == "fpr" {print $10; want = 0}'
          )
          [[ "${#primary_fingerprints[@]}" -eq 1 && "${primary_fingerprints[0]}" == "$pin" ]] || {
            echo "::error::release keyring is not exactly the pinned primary key"
            exit 1
          }
          status="$(gpg --no-options --batch --status-fd=1 --verify \
            "rel/$archive.asc" "rel/$archive" 2>/tmp/gpg-verify.log)" || {
            cat /tmp/gpg-verify.log >&2
            exit 1
          }
          awk -v pin="$pin" '
            $1 == "[GNUPG:]" && $2 == "GOODSIG" { outcome_count++; good_count++ }
            $1 == "[GNUPG:]" && $2 ~ /^(EXPSIG|EXPKEYSIG|REVKEYSIG|BADSIG|ERRSIG)$/ { outcome_count++ }
            $1 == "[GNUPG:]" && $2 == "VALIDSIG" {
              valid_count++
              if ($3 == pin || $NF == pin) pinned_count++
            }
            END { exit !(outcome_count == 1 && good_count == 1 && valid_count == 1 && pinned_count == 1) }
          ' <<<"$status" || {
            echo "::error::signature is not uniquely bound to the pinned primary key"
            exit 1
          }

          epoch="$(git -C released-source show -s --format=%ct HEAD)"
          python3 -I build/release-archive-test.py \
            "rel/$archive" "$version" "$epoch" released-source

          release_work="$(mktemp -d)"
          env -u TAR_OPTIONS -u GZIP -u BZIP2 -u XZ_OPT \
            tar --no-same-owner --no-same-permissions -xzf "rel/$archive" -C "$release_work"
          package_dir="$release_work/security-update-notify-$version"
          for arch in amd64 arm64 386 ppc64le s390x; do
            runtime="$package_dir/files/security-update-notify-linux-$arch"
            [[ -x "$runtime" ]] || { echo "::error::missing executable linux/$arch runtime"; exit 1; }
            program_headers="$(LC_ALL=C readelf -W -l "$runtime")" || {
              echo "::error::could not inspect linux/$arch program headers"
              exit 1
            }
            if grep -Eq '(^|[[:space:]])INTERP([[:space:]]|$)' <<<"$program_headers"; then
              echo "::error::linux/$arch runtime has a dynamic interpreter"
              exit 1
            fi
            dynamic_section="$(LC_ALL=C readelf -W -d "$runtime")" || {
              echo "::error::could not inspect linux/$arch dynamic section"
              exit 1
            }
            if grep -Fq '(NEEDED)' <<<"$dynamic_section"; then
              echo "::error::linux/$arch runtime has shared-library dependencies"
              exit 1
            fi
          done
          runtime="$package_dir/files/security-update-notify-linux-amd64"
          runtime_version_file="$release_work/runtime-version"
          runtime_version_part="${runtime_version_file}.part"
          rm -f -- "$runtime_version_part"
          if ! /usr/bin/env -i LC_ALL=C PATH=/usr/bin:/bin \
              /usr/bin/timeout --signal=TERM --kill-after=5s 15s "$runtime" --version 2>/dev/null | \
              /usr/bin/python3 -I "$RUNNER_TEMP/write-limited.py" 4096 "$runtime_version_part" || \
              ! mv -f -- "$runtime_version_part" "$runtime_version_file"; then
            rm -f -- "$runtime_version_part"
            echo "::error::released amd64 runtime version probe failed, timed out, or exceeded 4096 bytes"
            exit 1
          fi
          expected_runtime_version="security-update-notify $version"
          runtime_version=''
          IFS= read -r runtime_version < "$runtime_version_file" || true
          [[ "$runtime_version" == "$expected_runtime_version" \
             && "$(wc -c < "$runtime_version_file")" -eq "$((${#expected_runtime_version} + 1))" ]] || {
            echo "::error::released amd64 runtime version is not bound to $TAG"
            exit 1
          }
          if [[ -n "$BOOTSTRAP_SIGNATURE_ASSET" ]]; then
            cmp released-source/sun.sh "$package_dir/sun.sh" || {
              echo "::error::signed archive bootstrap differs from the released tag"
              exit 1
            }
            cmp released-source/files/release-signing.pub.asc "$package_dir/files/release-signing.pub.asc" || {
              echo "::error::signed archive verification key differs from the released tag"
              exit 1
            }
            cmp files/release-signing.pub.asc "$package_dir/files/release-signing.pub.asc" || {
              echo "::error::signed archive verification key differs from the trusted workflow key"
              exit 1
            }
            bootstrap_status="$(gpg --no-options --batch --known-notation "$BOOTSTRAP_VERSION_NOTATION" \
              --status-fd=1 --show-notation \
              --verify "rel/$BOOTSTRAP_SIGNATURE_ASSET" "$package_dir/sun.sh" 2>/tmp/gpg-bootstrap-verify.log)" || {
              cat /tmp/gpg-bootstrap-verify.log >&2
              exit 1
            }
            awk -v pin="$pin" -v notation="$BOOTSTRAP_VERSION_NOTATION" -v version="$version" '
              $1 == "[GNUPG:]" && $2 == "GOODSIG" { outcome_count++; good_count++ }
              $1 == "[GNUPG:]" && $2 ~ /^(EXPSIG|EXPKEYSIG|REVKEYSIG|BADSIG|ERRSIG)$/ { outcome_count++ }
              $1 == "[GNUPG:]" && $2 == "VALIDSIG" {
                valid_count++
                if ($3 == pin || $NF == pin) pinned_count++
              }
              $1 == "[GNUPG:]" && $2 == "NOTATION_NAME" {
                name_count++
                if (NF == 3 && $3 == notation) name_match++
              }
              $1 == "[GNUPG:]" && $2 == "NOTATION_FLAGS" {
                flags_count++
                if (NF == 4 && $3 == 1 && $4 == 1) flags_match++
              }
              $1 == "[GNUPG:]" && $2 == "NOTATION_DATA" {
                data_count++
                if (NF == 3 && $3 == version) data_match++
              }
              END {
                exit !(outcome_count == 1 && good_count == 1 &&
                       valid_count == 1 && pinned_count == 1 &&
                       name_count == 1 && name_match == 1 &&
                       flags_count == 1 && flags_match == 1 &&
                       data_count == 1 && data_match == 1)
              }
            ' <<<"$bootstrap_status" || {
                echo "::error::bootstrap signature is not uniquely bound to the pinned key and release version"
                exit 1
              }
          fi
          echo "OK: $archive and its first-install bootstrap are allowlisted and signed by $pin"
